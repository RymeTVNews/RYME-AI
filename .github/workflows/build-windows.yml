name: Build Windows (exe et msi)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Test de l'interface (souris, aperçu d'image)
        continue-on-error: true  # signale un problème sans bloquer la fabrication de l'exe
        run: python tests/gui_smoke.py
      - name: Build exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name RYME-AI run_gui.py
          pyinstaller --onefile --name ryme-ai-cli run_cli.py
      - uses: actions/upload-artifact@v4
        with:
          name: ryme-ai-windows
          path: |
            dist/RYME-AI.exe
            dist/ryme-ai-cli.exe
      - name: Build msi (WiX)
        id: msi
        continue-on-error: true  # un souci d'installeur ne bloque pas les exe déjà publiés
        run: |
          $version = if ("${{ github.ref }}" -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $Matches[1] } else { python -c "from ryme_ai import __version__; print(__version__)" }
          dotnet tool install --global wix --version 5.0.2
          wix build installer\Package.wxs -arch x64 -d Version=$version -d DistDir="$PWD\dist" -o "dist\RYME-AI-$version-x64.msi"
      - uses: actions/upload-artifact@v4
        if: steps.msi.outcome == 'success'
        with:
          name: ryme-ai-msi
          path: dist/*.msi
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RYME-AI.exe
            dist/ryme-ai-cli.exe
            dist/*.msi
